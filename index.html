<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suite de Estudio · Fundamentos de Ciberseguridad</title>
<style>
:root{
  --bg:#0b0f17; --bg2:#0e1420; --panel:#151c2a; --panel2:#1b2435; --panel3:#212c41;
  --ink:#eaf0f7; --ink2:#9fb0c4; --muted:#69788c;
  --acc:#5b9dff; --acc2:#9b6dff; --acc3:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --line:#26324a; --line2:#324159;
  --radius:16px; --radius-sm:11px;
  --shadow:0 14px 40px rgba(0,0,0,.45);
  --shadow-sm:0 6px 18px rgba(0,0,0,.30);
  --glow:0 0 0 1px rgba(91,157,255,.25), 0 10px 30px rgba(91,157,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);line-height:1.62;min-height:100vh;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(155,109,255,.14), transparent 60%),
    radial-gradient(900px 600px at -10% 10%, rgba(91,157,255,.13), transparent 55%),
    linear-gradient(170deg,#0b0f17,#0c1120 55%,#0a0e16);
  background-attachment:fixed;
}
a{color:var(--acc);text-decoration:none}
::selection{background:rgba(91,157,255,.32)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#3d4f6e;background-clip:padding-box}
.app{display:flex;min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{width:312px;flex-shrink:0;background:rgba(11,15,23,.78);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;backdrop-filter:blur(14px);z-index:40}
.brand{padding:24px 22px 18px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.brand::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 120px at 20% 0%,rgba(91,157,255,.16),transparent)}
.brand-row{display:flex;align-items:center;gap:12px;position:relative}
.brand-logo{width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm)}
.brand-logo svg{width:24px;height:24px}
.brand h1{font-size:15.5px;letter-spacing:.2px;line-height:1.25;position:relative}
.brand .sub{font-size:11.5px;color:var(--ink2);margin-top:7px;position:relative}
.brand .tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--acc);
  background:rgba(91,157,255,.1);border:1px solid rgba(91,157,255,.3);border-radius:20px;padding:3px 11px;position:relative}
.searchbox{padding:14px 16px 8px;position:relative}
.searchbox input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:11px 13px 11px 38px;border-radius:11px;font-size:13px;outline:none;transition:.18s}
.searchbox input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,157,255,.14);background:var(--panel)}
.searchbox .si{position:absolute;left:28px;top:24px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.nav{padding:6px 0 36px}
.nav .group-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);
  padding:16px 22px 7px;font-weight:600}
.nav a.navlink{display:flex;gap:11px;align-items:center;padding:9px 18px;font-size:13px;color:var(--ink2);
  border-left:3px solid transparent;cursor:pointer;transition:.14s;position:relative}
.nav a.navlink:hover{background:rgba(255,255,255,.035);color:var(--ink)}
.nav a.navlink.active{background:linear-gradient(90deg,rgba(91,157,255,.16),transparent);color:#fff;border-left-color:var(--acc)}
.nav a.navlink .num{flex-shrink:0;width:25px;height:25px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--acc);font-weight:700;transition:.14s}
.nav a.navlink.active .num{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.nav a.navlink .ic{flex-shrink:0;width:17px;height:17px;color:currentColor;opacity:.85}
.nav a.navlink .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);opacity:0;transition:.2s}
.nav a.navlink.seen .dot{opacity:.9}
.nav .tool .num{color:var(--acc2)}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;position:relative}
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,15,23,.72);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.progress-wrap{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink2);margin-left:auto}
.progress-bar{width:170px;height:8px;background:var(--panel2);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3));transition:width .5s cubic-bezier(.4,0,.2,1)}
.content{max-width:960px;margin:0 auto;padding:38px 32px 110px}

/* ============ VIEWS ============ */
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ============ HERO / HOME ============ */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(91,157,255,.14),rgba(155,109,255,.12));
  border:1px solid var(--line);border-radius:22px;padding:38px 36px;margin-bottom:30px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,109,255,.22),transparent 70%);pointer-events:none}
.hero .kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);font-weight:600;margin-bottom:10px}
.hero h2{font-size:30px;margin-bottom:12px;line-height:1.2;letter-spacing:-.5px}
.hero p{color:var(--ink2);max-width:700px;font-size:14.5px}
.hero-main{display:flex;gap:30px;align-items:center;flex-wrap:wrap;position:relative}
.hero-text{flex:1;min-width:280px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{position:relative;width:128px;height:128px}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rt b{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring .rt span{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px}
.ring-cap{font-size:11.5px;color:var(--muted)}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;position:relative}
.stat{background:rgba(21,28,42,.6);border:1px solid var(--line);border-radius:14px;padding:15px 20px;min-width:120px;transition:.2s}
.stat:hover{border-color:var(--line2);transform:translateY(-2px)}
.stat .n{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
.section-label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600;
  margin:34px 0 16px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}
.mcard{position:relative;background:linear-gradient(160deg,var(--panel),rgba(21,28,42,.55));border:1px solid var(--line);
  border-radius:16px;padding:20px;cursor:pointer;transition:.22s cubic-bezier(.4,0,.2,1);overflow:hidden}
.mcard::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transform:scaleX(0);transform-origin:left;transition:.25s}
.mcard:hover{border-color:var(--line2);transform:translateY(-4px);box-shadow:var(--shadow)}
.mcard:hover::before{transform:scaleX(1)}
.mcard .mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mcard .mc-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(91,157,255,.16),rgba(155,109,255,.16));border:1px solid var(--line)}
.mcard .mc-ic svg{width:21px;height:21px;color:var(--acc)}
.mcard .mc-num{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.mcard .mc-check{width:20px;height:20px;color:var(--ok);opacity:0;transition:.2s}
.mcard.seen .mc-check{opacity:1}
.mcard h4{font-size:15.5px;margin:0 0 7px;line-height:1.3}
.mcard p{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ============ MODULE ============ */
.mod-head{position:relative;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px}
.mod-head .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--acc);letter-spacing:.6px;
  text-transform:uppercase;font-weight:600;background:rgba(91,157,255,.1);border:1px solid rgba(91,157,255,.28);
  padding:4px 12px;border-radius:20px}
.mod-head h2{font-size:30px;margin:14px 0 9px;letter-spacing:-.5px;line-height:1.18}
.mod-head .lead{color:var(--ink2);font-size:15px;max-width:760px}
.mod-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.mod-meta span{display:inline-flex;align-items:center;gap:6px}
.mod-meta svg{width:15px;height:15px;opacity:.8}

/* TL;DR */
.tldr{background:linear-gradient(135deg,rgba(52,211,153,.09),rgba(34,211,238,.06));
  border:1px solid rgba(52,211,153,.28);border-radius:16px;padding:20px 22px;margin:26px 0}
.tldr .tldr-h{display:flex;align-items:center;gap:9px;font-size:12.5px;text-transform:uppercase;letter-spacing:1px;
  color:var(--ok);font-weight:700;margin-bottom:13px}
.tldr .tldr-h svg{width:17px;height:17px}
.tldr ul{list-style:none;display:grid;gap:9px}
.tldr li{position:relative;padding-left:20px;font-size:14px;color:var(--ink);line-height:1.55}
.tldr li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,var(--ok),var(--acc3))}

/* mini-TOC */
.toc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;margin:0 0 26px;
  display:flex;flex-wrap:wrap;gap:4px}
.toc-h{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.toc a{font-size:12.5px;color:var(--ink2);padding:7px 12px;border-radius:9px;transition:.15s;cursor:pointer;display:flex;align-items:center;gap:7px}
.toc a .tn{width:18px;height:18px;border-radius:5px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--acc);font-weight:700}
.toc a:hover{background:var(--panel2);color:var(--ink)}
.toc a.active{background:rgba(91,157,255,.14);color:#fff}
.toc a.active .tn{background:var(--acc);color:#fff}

/* collapsible sections */
.sec{border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;background:rgba(21,28,42,.4);transition:.2s}
.sec.open{background:rgba(21,28,42,.62);border-color:var(--line2)}
.sec-h{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none;transition:.15s}
.sec-h:hover{background:rgba(255,255,255,.025)}
.sec-h .sec-bar{width:4px;align-self:stretch;border-radius:4px;background:linear-gradient(180deg,var(--acc),var(--acc2));flex-shrink:0}
.sec-h h3{font-size:18px;margin:0;border:0;padding:0;flex:1;letter-spacing:-.2px}
.sec-h .chev{width:20px;height:20px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.sec.open .sec-h .chev{transform:rotate(180deg);color:var(--acc)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-body-inner{overflow:hidden;min-height:0}
.sec-body-pad{padding:2px 22px 18px}

/* content typography */
.content h3{font-size:20px;margin:30px 0 12px;padding-left:13px;border-left:4px solid var(--acc)}
.content h4{font-size:15.5px;margin:20px 0 8px;color:var(--acc);letter-spacing:.1px}
.content p{margin:11px 0;color:var(--ink2)}
.content p strong,.content li strong{color:var(--ink)}
.content ul,.content ol{margin:11px 0 11px 24px}
.content li{margin:7px 0;color:var(--ink2)}
.content code{background:var(--panel3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--acc3)}

/* auto card-lists */
.content ul.cards{list-style:none;margin:16px 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.content ul.cards li{margin:0;background:linear-gradient(160deg,var(--panel),rgba(21,28,42,.5));
  border:1px solid var(--line);border-radius:13px;padding:15px 16px;font-size:13px;color:var(--ink2);
  position:relative;transition:.18s;line-height:1.5}
.content ul.cards li:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.content ul.cards li strong{display:block;color:var(--ink);margin-bottom:5px;font-size:13.5px;padding-left:13px;position:relative}
.content ul.cards li strong::before{content:"";position:absolute;left:0;top:4px;width:5px;height:13px;border-radius:3px;
  background:linear-gradient(180deg,var(--acc),var(--acc2))}
/* auto chip-lists */
.content ul.chips{list-style:none;display:flex;flex-wrap:wrap;gap:9px;padding:0;margin:15px 0}
.content ul.chips li{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:7px 15px;font-size:13px;color:var(--ink);transition:.16s;cursor:default}
.content ul.chips li:hover{border-color:var(--acc);background:rgba(91,157,255,.1);transform:translateY(-1px)}

blockquote{border-left:4px solid var(--acc2);background:linear-gradient(90deg,rgba(155,109,255,.08),transparent);
  padding:14px 20px;border-radius:0 12px 12px 0;margin:18px 0;color:var(--ink);font-style:italic;font-size:14.5px}
.note,.example,.thread{border-radius:13px;padding:15px 18px;margin:18px 0;font-size:13.5px;color:var(--ink2);position:relative}
.note{background:rgba(91,157,255,.07);border:1px solid rgba(91,157,255,.26)}
.example{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.26)}
.thread{background:rgba(155,109,255,.08);border:1px solid rgba(155,109,255,.26)}
.note .nt,.example .nt,.thread .nt{display:flex;align-items:center;gap:7px;font-size:11.5px;text-transform:uppercase;
  letter-spacing:1px;font-weight:700;margin-bottom:6px}
.note .nt{color:var(--acc)} .example .nt{color:var(--ok)} .thread .nt{color:var(--acc2)}
.note .nt::before,.example .nt::before,.thread .nt::before{content:"";width:15px;height:15px;border-radius:4px;flex-shrink:0}
.note .nt::before{background:var(--acc)} .example .nt::before{background:var(--ok)} .thread .nt::before{background:var(--acc2)}

table.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:13.5px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;vertical-align:top}
table.tbl th{background:var(--panel2);color:var(--acc);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover td{background:rgba(255,255,255,.022)}
table.tbl tr:nth-child(even) td{background:rgba(255,255,255,.015)}

/* diagrams */
.diagram-box{background:linear-gradient(135deg,rgba(91,157,255,.06),rgba(155,109,255,.05));
  border:1px solid var(--line);border-radius:16px;padding:20px 22px 16px;margin:22px 0}
.diagram-box .dg-title{display:flex;align-items:center;gap:9px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--acc);font-weight:700;margin-bottom:15px}
.diagram-box .dg-title::before{content:"";width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.diagram-box svg{width:100%;height:auto;max-width:660px;display:block;margin:0 auto}

/* module nav */
.modnav{display:flex;justify-content:space-between;margin-top:34px;gap:14px}
.modnav button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);padding:14px 18px;
  border-radius:13px;cursor:pointer;font-size:13px;transition:.18s;flex:1;text-align:left;display:flex;flex-direction:column;gap:3px}
.modnav button .ml{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.modnav button:last-child{text-align:right}
.modnav button:hover:not(:disabled){border-color:var(--acc);color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.modnav button:disabled{opacity:.3;cursor:default}

/* ============ FLASHCARDS ============ */
.fc-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.fc-controls select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 13px;border-radius:10px;font-size:13px;outline:none;cursor:pointer}
.fc-controls select:focus{border-color:var(--acc)}
.fc-stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.fc-stat{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 16px}
.fc-stat .n{font-size:22px;font-weight:800}
.fc-stat .l{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.fc-stat.know .n{color:var(--ok)} .fc-stat.rev .n{color:var(--warn)} .fc-stat.tot .n{color:var(--acc)}
.flashcard{perspective:1600px;height:340px;margin:0 auto;max-width:580px}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc-inner.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line2);
  padding:34px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.fc-front{background:linear-gradient(150deg,var(--panel2),var(--panel))}
.fc-back{background:linear-gradient(150deg,rgba(91,157,255,.14),rgba(155,109,255,.12));transform:rotateY(180deg);overflow-y:auto}
.fc-face .lbl{position:absolute;top:16px;left:20px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.fc-tag{position:absolute;top:14px;right:18px;font-size:10.5px;color:var(--acc);border:1px solid var(--line2);border-radius:14px;padding:3px 11px}
.fc-known-badge{position:absolute;bottom:16px;right:18px;font-size:10.5px;color:var(--ok);display:none;align-items:center;gap:5px}
.fc-known-badge svg{width:14px;height:14px}
.fc-front .q{font-size:22px;font-weight:600;line-height:1.35}
.fc-back .a{font-size:15px;color:var(--ink);line-height:1.65}
.fc-hint{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px}
.fc-bottom{display:flex;justify-content:center;gap:12px;margin-top:18px;align-items:center;flex-wrap:wrap}
.fc-nav-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);width:46px;height:46px;border-radius:12px;cursor:pointer;font-size:16px;transition:.16s;display:flex;align-items:center;justify-content:center}
.fc-nav-btn:hover{border-color:var(--acc);color:var(--acc)}
.fc-nav-btn svg{width:20px;height:20px}
.fc-counter{font-size:13px;color:var(--ink2);min-width:80px;text-align:center}
.fc-judge{display:flex;justify-content:center;gap:12px;margin-top:14px}
.fc-judge button{padding:11px 22px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid var(--line);transition:.16s;display:flex;align-items:center;gap:8px}
.fc-judge .know{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4);color:var(--ok)}
.fc-judge .know:hover{background:rgba(52,211,153,.22)}
.fc-judge .rev{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4);color:var(--warn)}
.fc-judge .rev:hover{background:rgba(251,191,36,.22)}
.fc-judge button svg{width:16px;height:16px}

/* ============ QUIZ ============ */
.quiz-intro{background:linear-gradient(135deg,var(--panel),rgba(21,28,42,.5));border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.quiz-intro b{font-size:16px}
.quiz-best{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--warn);
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:4px 13px}
.quiz-best svg{width:15px;height:15px}
.quiz-q{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:15px;animation:pop .3s ease backwards}
.quiz-q .qhead{font-size:11.5px;color:var(--acc);margin-bottom:7px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.quiz-q .qtext{font-size:16px;font-weight:600;margin-bottom:15px;line-height:1.4}
.opt{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 16px;
  margin:9px 0;cursor:pointer;font-size:14px;transition:.16s;position:relative}
.opt:hover{border-color:var(--line2);background:var(--panel3)}
.opt.sel{border-color:var(--acc);background:rgba(91,157,255,.12)}
.opt.correct{border-color:var(--ok);background:rgba(52,211,153,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(251,113,133,.15)}
.opt .exp{display:none;margin-top:9px;font-size:12.5px;color:var(--ink2);border-top:1px dashed var(--line2);padding-top:9px}
.opt.show-exp .exp{display:block}
.quiz-actions{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;padding:13px 26px;
  border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;transition:.18s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--acc);box-shadow:none}
.quiz-result{background:linear-gradient(135deg,rgba(91,157,255,.14),rgba(155,109,255,.12));
  border:1px solid var(--line2);border-radius:18px;padding:30px;text-align:center;margin-bottom:20px;animation:pop .4s ease}
.quiz-result .score{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.quiz-result .msg{color:var(--ink2);margin-top:6px;font-size:14px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{background:transparent;border:none;color:var(--ink2);padding:8px 16px;border-radius:9px;cursor:pointer;font-size:13px;transition:.15s;font-weight:500}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}

/* search */
.searchresults{margin-top:6px}
.sr-item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:11px;cursor:pointer;transition:.16s}
.sr-item:hover{border-color:var(--acc);transform:translateX(4px)}
.sr-item .sr-mod{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.sr-item h5{font-size:15px;margin:4px 0}
.sr-item p{font-size:13px;color:var(--muted)}
mark{background:rgba(251,191,36,.35);color:#fff;border-radius:3px;padding:0 3px}
.empty{color:var(--muted);text-align:center;padding:50px}

.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}

/* back to top */
.totop{position:fixed;right:26px;bottom:26px;width:46px;height:46px;border-radius:14px;z-index:35;
  background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transform:translateY(14px) scale(.9);transition:.25s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop svg{width:22px;height:22px}

/* mobile */
.menu-btn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  width:40px;height:40px;border-radius:11px;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;backdrop-filter:blur(2px)}
.overlay.show{display:block}
@media(max-width:880px){
  .sidebar{position:fixed;left:-320px;transition:left .3s cubic-bezier(.4,0,.2,1)}
  .sidebar.open{left:0}
  .menu-btn{display:flex}
  .content{padding:26px 18px 100px}
  .hero{padding:28px 22px}
  .hero h2{font-size:24px}
  .mod-head h2{font-size:24px}
  .progress-bar{width:110px}
}
@media(max-width:520px){
  .modnav{flex-direction:column}
  .stat{flex:1}
}

</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <h1>Fundamentos de Ciberseguridad</h1>

      </div>
      <div class="sub">Suite de estudio interactiva · Universidad de Palermo</div>

    </div>
    <div class="searchbox">
      <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

  <div class="main">

      <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="progress-wrap">
        <span id="progressLabel">Progreso</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<button class="totop" id="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Subir">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
</button>

<script>
/* ============ DATOS DEL CURSO ============ */
const MODULES = [];
const FLASHCARDS = [];
const QUIZ = [];
const DIAGRAMS = [];
</script>
<script src="suite-data-ciber.js"></script>
<script src="suite-diagramas-ciber.js"></script>
<script>
/* ============ ÍCONOS ============ */
const ICONS = {
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  branch:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M6 9v6M9 6h3a3 3 0 0 1 3 3M9 18h3a3 3 0 0 0 3-3"/>',
  layers:'<path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  scale:'<path d="M12 3v18M5 21h14M7 7l-4 7h8l-4-7zM17 7l-4 7h8l-4-7zM7 7l5-2 5 2"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 5.5v14"/>',
  tools:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/>',
  alert:'<path d="M10.3 3.8 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/>',
  cards:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  star:'<path d="m12 2 3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
  flip:'<path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3"/><path d="M21 3v5h-5M3 21v-5h5"/>',
  chevron:'<path d="m6 9 6 6 6-6"/>'
};
const MOD_ICON = ['shield','branch','layers','refresh','scale','book','tools','alert','zap','activity','search','building'];
function icon(name,cls){return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.shield)+'</svg>';}

/* ============ ESTADO ============ */
let current='home';
const LS='ciberSuite_v2';
let store={visited:[],known:{},best:{}};
try{const s=JSON.parse(localStorage.getItem(LS));if(s)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}
let visited=new Set(store.visited||[]);

document.getElementById('moduleTag').innerHTML=icon('layers')+' '+MODULES.length+' módulos';
document.getElementById('moduleTag').style.cssText+=';gap:6px';

/* ============ NAV ============ */
function buildNav(){
  const nav=document.getElementById('nav');
  let html='<div class="group-title">General</div>';
  html+=navLink('home',icon('star','ic'),'Inicio');
  html+='<div class="group-title">Módulos</div>';
  MODULES.forEach((m,i)=>html+=navLink('mod-'+i,'<span class="num">'+(i+1)+'</span>',m.title,false,i));
  html+='<div class="group-title">Herramientas de estudio</div>';
  html+=navLink('flashcards',icon('cards','ic'),'Flashcards',true);
  html+=navLink('quiz',icon('check','ic'),'Quiz interactivo',true);
  nav.innerHTML=html;
}
function navLink(id,lead,label,tool,modIdx){
  const seen=(modIdx!=null&&visited.has(modIdx))?' seen':'';
  return '<a class="navlink '+(tool?'tool':'')+seen+'" data-view="'+id+'" onclick="go(\''+id+'\')">'+
    lead+'<span>'+label+'</span>'+(modIdx!=null?'<span class="dot"></span>':'')+'</a>';
}
function setActiveNav(id){document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('active',a.dataset.view===id));}
function updateProgress(){
  const pct=Math.round(visited.size/MODULES.length*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent='Módulos vistos: '+visited.size+'/'+MODULES.length;
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function go(id){
  current=id;
  setActiveNav(id);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  window.scrollTo(0,0);
  if(id==='home')renderHome();
  else if(id==='flashcards')renderFlashcards();
  else if(id==='quiz')renderQuiz();
  else if(id.startsWith('mod-')){
    const i=+id.split('-')[1];
    if(!visited.has(i)){visited.add(i);store.visited=[...visited];save();
      document.querySelectorAll('.navlink').forEach(a=>{if(a.dataset.view==='mod-'+i)a.classList.add('seen');});}
    updateProgress();renderModule(i);
  }
}

/* ============ HOME ============ */
function renderHome(){
  const totalCards=FLASHCARDS.length,totalQ=QUIZ.reduce((a,m)=>a+m.questions.length,0);
  const pct=Math.round(visited.size/MODULES.length*100);
  const C=2*Math.PI*54, off=C*(1-pct/100);
  const cards=MODULES.map((m,i)=>{
    const seen=visited.has(i)?' seen':'';
    return '<div class="mcard'+seen+'" onclick="go(\'mod-'+i+'\')">'+
      '<div class="mc-top"><div class="mc-ic">'+icon(m.icon||MOD_ICON[i]||'shield')+'</div>'+
      '<span class="mc-num">Módulo '+(i+1)+'</span>'+icon('check','mc-check')+'</div>'+
      '<h4>'+m.title+'</h4><p>'+m.lead+'</p></div>';
  }).join('');
  document.getElementById('content').innerHTML=
  '<div class="view active"><div class="hero"><div class="hero-main"><div class="hero-text">'+
    '<div class="kicker">Suite de estudio</div>'+
    '<h2>Fundamentos de Ciberseguridad</h2>'+
    '<p>Todo el material de la materia organizado para estudiar de verdad: contenido por módulos con hilo conductor, '+
    'diagramas, tarjetas de repaso y autoevaluación. El recorrido sigue el flujo lógico de la disciplina — del ciberespacio '+
    'y sus amenazas a la gestión, los estándares, las herramientas, la respuesta a incidentes, la continuidad y la auditoría — '+
    'y cierra con un caso práctico real.</p>'+
    '<div class="stat-row">'+
      '<div class="stat"><div class="n">'+MODULES.length+'</div><div class="l">Módulos</div></div>'+
      '<div class="stat"><div class="n">'+totalCards+'</div><div class="l">Flashcards</div></div>'+
      '<div class="stat"><div class="n">'+totalQ+'</div><div class="l">Preguntas</div></div>'+
      '<div class="stat"><div class="n">'+(DIAGRAMS.flat().filter(Boolean).length)+'</div><div class="l">Diagramas</div></div>'+
    '</div></div>'+
    '<div class="ring-wrap"><div class="ring"><svg width="128" height="128">'+
      '<circle cx="64" cy="64" r="54" fill="none" stroke="var(--line)" stroke-width="11"/>'+
      '<circle cx="64" cy="64" r="54" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset 1s ease"/>'+
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient></defs>'+
      '</svg><div class="rt"><b>'+pct+'%</b><span>completado</span></div></div>'+
      '<div class="ring-cap">'+visited.size+' de '+MODULES.length+' módulos</div></div>'+
  '</div></div>'+
  '<div class="section-label">Mapa del curso</div>'+
  '<div class="card-grid">'+cards+'</div>'+
  '<div class="footer">Material basado en los apuntes de la Universidad de Palermo · Suite de estudio para uso personal.</div>'+
  '</div>';
}

/* ============ DIAGRAMAS (inyección) ============ */
function injectDiagrams(bodyHtml,dlist){
  if(!dlist.length)return bodyHtml;
  const tmp=document.createElement('div');tmp.innerHTML=bodyHtml;
  const used=new Set();
  dlist.forEach(d=>{
    const box=document.createElement('div');box.className='diagram-box';
    box.innerHTML='<div class="dg-title">'+d.title+'</div>'+d.svg;
    const heads=[...tmp.querySelectorAll('h3,h4')];
    let target=null;const anc=(d.anchor||'').toLowerCase();
    for(const h of heads){if(used.has(h))continue;if(anc&&h.textContent.toLowerCase().includes(anc)){target=h;used.add(h);break;}}
    if(target){let last=target,node=target.nextElementSibling;
      while(node&&!/^H[34]$/.test(node.tagName)){last=node;node=node.nextElementSibling;}last.after(box);}
    else tmp.insertBefore(box,tmp.firstChild);
  });
  return tmp.innerHTML;
}

/* ============ TARJETAS AUTOMÁTICAS ============ */
function enhanceLists(root){
  root.querySelectorAll('ul').forEach(ul=>{
    if(ul.classList.contains('cards')||ul.classList.contains('chips'))return;
    const lis=[...ul.children].filter(n=>n.tagName==='LI');
    if(lis.length<3)return;
    if(lis.some(li=>li.querySelector('ul,ol,table,p,code,a')))return;
    const allDef=lis.every(li=>{const s=li.firstElementChild;return s&&s.tagName==='STRONG'&&s.textContent.includes(':');});
    const allShort=lis.every(li=>!li.querySelector('strong')&&li.textContent.trim().replace(/\.$/,'').length<=46);
    if(allDef)ul.classList.add('cards');
    else if(allShort)ul.classList.add('chips');
  });
}

/* ============ MÓDULO ============ */
let tocObserver=null;
function renderModule(i){
  const m=MODULES[i];
  const raw=DIAGRAMS[i];const dlist=Array.isArray(raw)?raw:(raw?[raw]:[]);
  const injected=injectDiagrams(m.body,dlist);

  // parse + mejorar listas
  const tmp=document.createElement('div');tmp.innerHTML=injected;
  enhanceLists(tmp);

  // tiempo de lectura
  const words=(tmp.textContent||'').trim().split(/\s+/).length;
  const mins=Math.max(1,Math.round(words/200));

  // agrupar en secciones colapsables por h3
  const nodes=[...tmp.childNodes];
  let intro='',sections=[],cur=null;
  nodes.forEach(n=>{
    if(n.nodeType===1&&n.tagName==='H3'){
      if(cur)sections.push(cur);
      cur={title:n.textContent,body:''};
    } else {
      const html=n.nodeType===1?n.outerHTML:(n.textContent.trim()?n.textContent:'');
      if(cur)cur.body+=html; else intro+=html;
    }
  });
  if(cur)sections.push(cur);

  // TL;DR
  let tldr='';
  if(m.key&&m.key.length){
    tldr='<div class="tldr"><div class="tldr-h">'+icon('bulb')+' Puntos clave</div><ul>'+
      m.key.map(k=>'<li>'+k+'</li>').join('')+'</ul></div>';
  }

  // mini-índice
  let toc='';
  if(sections.length>1){
    toc='<div class="toc"><div class="toc-h">En este módulo</div>'+
      sections.map((s,si)=>'<a data-sec="sec-'+i+'-'+si+'" onclick="jumpSec('+i+','+si+')"><span class="tn">'+(si+1)+'</span>'+s.title+'</a>').join('')+
      '</div>';
  }

  // secciones
  const secHtml=sections.map((s,si)=>{
    const open=si===0?' open':'';
    return '<section class="sec'+open+'" id="sec-'+i+'-'+si+'">'+
      '<div class="sec-h" onclick="toggleSec(this)"><span class="sec-bar"></span><h3>'+s.title+'</h3>'+
      icon('chevron','chev')+'</div>'+
      '<div class="sec-body"><div class="sec-body-inner"><div class="sec-body-pad">'+s.body+'</div></div></div></section>';
  }).join('');

  const prev=i>0?'<button onclick="go(\'mod-'+(i-1)+'\')"><span class="ml">← Anterior</span>'+MODULES[i-1].title+'</button>':'<button disabled><span class="ml">Inicio del curso</span>—</button>';
  const next=i<MODULES.length-1?'<button onclick="go(\'mod-'+(i+1)+'\')"><span class="ml">Siguiente →</span>'+MODULES[i+1].title+'</button>':'<button onclick="go(\'flashcards\')"><span class="ml">Seguí estudiando →</span>Ir a Flashcards</button>';

  document.getElementById('content').innerHTML=
  '<div class="view active"><div class="mod-head">'+
    '<span class="eyebrow">'+icon(m.icon||MOD_ICON[i]||'shield')+' Módulo '+(i+1)+'</span>'+
    '<h2>'+m.title+'</h2><div class="lead">'+m.lead+'</div>'+
    '<div class="mod-meta">'+
      '<span>'+icon('clock')+' '+mins+' min de lectura</span>'+
      '<span>'+icon('list')+' '+sections.length+' secciones</span>'+
      (dlist.length?'<span>'+icon('activity')+' '+dlist.length+' diagrama'+(dlist.length>1?'s':'')+'</span>':'')+
    '</div></div>'+
    intro+tldr+toc+
    '<div style="display:flex;gap:8px;margin:0 0 16px"><button class="btn ghost" style="padding:8px 14px;font-size:12.5px" onclick="allSec(true)">Expandir todo</button>'+
    '<button class="btn ghost" style="padding:8px 14px;font-size:12.5px" onclick="allSec(false)">Contraer todo</button></div>'+
    secHtml+
    '<div class="modnav">'+prev+next+'</div>'+
  '</div>';

  setupScrollSpy(i,sections.length);
}
function toggleSec(h){h.parentElement.classList.toggle('open');}
function allSec(open){document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('open',open));}
function jumpSec(i,si){
  const sec=document.getElementById('sec-'+i+'-'+si);
  if(sec){sec.classList.add('open');sec.scrollIntoView({behavior:'smooth',block:'start'});}
}
function setupScrollSpy(i,n){
  if(tocObserver)tocObserver.disconnect();
  const links=document.querySelectorAll('.toc a');if(!links.length)return;
  tocObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){
      links.forEach(l=>l.classList.toggle('active',l.dataset.sec===e.target.id));
    }});
  },{rootMargin:'-20% 0px -70% 0px'});
  for(let si=0;si<n;si++){const el=document.getElementById('sec-'+i+'-'+si);if(el)tocObserver.observe(el);}
}

/* ============ FLASHCARDS ============ */
let fcDeck=[],fcIndex=0,fcOnlyReview=false;
function cardId(c){return c.mod+'_'+c.q.slice(0,40);}
function renderFlashcards(){
  const opts=['<option value="all">Todos los módulos</option>']
    .concat(MODULES.map((m,i)=>'<option value="'+i+'">M'+(i+1)+' · '+m.title+'</option>')).join('');
  document.getElementById('content').innerHTML=
  '<div class="view active"><div class="mod-head"><span class="eyebrow">'+icon('cards')+' Herramienta de estudio</span>'+
    '<h2>Flashcards</h2><div class="lead">Repaso activo. Girá la tarjeta, juzgá si la sabías y el progreso se guarda solo.</div></div>'+
    '<div class="fc-stats">'+
      '<div class="fc-stat tot"><div class="n" id="fcTot">0</div><div class="l">En el mazo</div></div>'+
      '<div class="fc-stat know"><div class="n" id="fcKnow">0</div><div class="l">Las sé</div></div>'+
      '<div class="fc-stat rev"><div class="n" id="fcRev">0</div><div class="l">Para repasar</div></div>'+
    '</div>'+
    '<div class="fc-controls">'+
      '<select id="fcFilter" onchange="loadDeck()">'+opts+'</select>'+
      '<button class="btn ghost" style="padding:10px 15px;font-size:13px" onclick="shuffleDeck()">'+icon('refresh')+' Mezclar</button>'+
      '<div class="seg" style="margin-left:auto"><button id="segAll" class="on" onclick="setReview(false)">Todas</button><button id="segRev" onclick="setReview(true)">Solo repasar</button></div>'+
    '</div>'+
    '<div class="flashcard"><div class="fc-inner" id="fcInner" onclick="flipCard()">'+
      '<div class="fc-face fc-front"><span class="lbl">Concepto</span><span class="fc-tag" id="fcTagF"></span><div class="q" id="fcQ"></div></div>'+
      '<div class="fc-face fc-back"><span class="lbl">Definición</span><span class="fc-tag" id="fcTagB"></span><div class="a" id="fcA"></div>'+
      '<span class="fc-known-badge" id="fcKnownB">'+icon('check')+' Ya la sabías</span></div>'+
    '</div></div>'+
    '<div class="fc-hint">Clic en la tarjeta (o barra espaciadora) para girarla · ← → para navegar</div>'+
    '<div class="fc-judge"><button class="rev" onclick="judge(false)">'+icon('refresh')+' Repasar</button>'+
      '<button class="know" onclick="judge(true)">'+icon('check')+' La sé</button></div>'+
    '<div class="fc-bottom">'+
      '<button class="fc-nav-btn" onclick="prevCard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>'+
      '<span class="fc-counter" id="fcCounter"></span>'+
      '<button class="fc-nav-btn" onclick="nextCard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>'+
    '</div></div>';
  loadDeck();
}
function setReview(v){fcOnlyReview=v;document.getElementById('segAll').classList.toggle('on',!v);document.getElementById('segRev').classList.toggle('on',v);loadDeck();}
function loadDeck(){
  const f=document.getElementById('fcFilter').value;
  let base=f==='all'?FLASHCARDS.slice():FLASHCARDS.filter(c=>c.mod==+f);
  if(fcOnlyReview)base=base.filter(c=>!store.known[cardId(c)]);
  fcDeck=base;fcIndex=0;showCard();updateFcStats();
}
function updateFcStats(){
  const f=document.getElementById('fcFilter').value;
  const base=f==='all'?FLASHCARDS:FLASHCARDS.filter(c=>c.mod==+f);
  const known=base.filter(c=>store.known[cardId(c)]).length;
  document.getElementById('fcTot').textContent=base.length;
  document.getElementById('fcKnow').textContent=known;
  document.getElementById('fcRev').textContent=base.length-known;
}
function shuffleDeck(){for(let i=fcDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fcDeck[i],fcDeck[j]]=[fcDeck[j],fcDeck[i]];}fcIndex=0;showCard();}
function showCard(){
  const inner=document.getElementById('fcInner');inner.classList.remove('flip');
  if(!fcDeck.length){document.getElementById('fcQ').textContent='No quedan tarjetas para repasar acá. ¡Bien ahí!';
    document.getElementById('fcA').textContent='';document.getElementById('fcCounter').textContent='0 / 0';
    document.getElementById('fcTagF').textContent='';document.getElementById('fcTagB').textContent='';
    document.getElementById('fcKnownB').style.display='none';return;}
  const c=fcDeck[fcIndex];
  document.getElementById('fcQ').textContent=c.q;
  document.getElementById('fcA').innerHTML=c.a;
  const tag='M'+(c.mod+1);
  document.getElementById('fcTagF').textContent=tag;
  document.getElementById('fcTagB').textContent=tag;
  document.getElementById('fcCounter').textContent=(fcIndex+1)+' / '+fcDeck.length;
  document.getElementById('fcKnownB').style.display=store.known[cardId(c)]?'flex':'none';
}
function flipCard(){document.getElementById('fcInner').classList.toggle('flip');}
function nextCard(){if(fcIndex<fcDeck.length-1){fcIndex++;showCard();}}
function prevCard(){if(fcIndex>0){fcIndex--;showCard();}}
function judge(known){
  if(!fcDeck.length)return;
  const c=fcDeck[fcIndex];
  if(known)store.known[cardId(c)]=1;else delete store.known[cardId(c)];
  save();updateFcStats();
  if(fcIndex<fcDeck.length-1){fcIndex++;showCard();}
  else{if(fcOnlyReview)loadDeck();else showCard();}
}

/* ============ QUIZ ============ */
let quizMod=0,quizAnswers={},quizSubmitted=false,quizExam=false,examQs=[];
function renderQuiz(){
  const opts=MODULES.map((m,i)=>'<option value="'+i+'">M'+(i+1)+' · '+m.title+'</option>').join('');
  document.getElementById('content').innerHTML=
  '<div class="view active"><div class="mod-head"><span class="eyebrow">'+icon('check')+' Herramienta de estudio</span>'+
    '<h2>Quiz interactivo</h2><div class="lead">Autoevaluación con corrección automática y explicación de cada respuesta. Tu mejor puntaje se guarda.</div></div>'+
    '<div class="fc-controls">'+
      '<div class="seg"><button id="qmMod" class="on" onclick="setExam(false)">Por módulo</button><button id="qmExam" onclick="setExam(true)">Modo examen</button></div>'+
      '<select id="quizFilter" onchange="loadQuiz()">'+opts+'</select>'+
    '</div><div id="quizArea"></div></div>';
  setExam(false);
}
function setExam(v){
  quizExam=v;
  document.getElementById('qmMod').classList.toggle('on',!v);
  document.getElementById('qmExam').classList.toggle('on',v);
  document.getElementById('quizFilter').style.display=v?'none':'';
  if(v)loadExam();else loadQuiz();
}
function loadExam(){
  quizAnswers={};quizSubmitted=false;
  let all=[];QUIZ.forEach((m,mi)=>m.questions.forEach(q=>all.push(Object.assign({_m:mi},q))));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  examQs=all.slice(0,12);
  let html='<div class="quiz-intro"><b>Modo examen</b><br><span style="color:var(--ink2);font-size:13px">12 preguntas al azar de todos los módulos. Elegí una opción por pregunta y corregí.</span></div>';
  examQs.forEach((q,qi)=>html+=renderQ(q,qi,'M'+(q._m+1)));
  html+='<div class="quiz-actions"><button class="btn" onclick="submitExam()">'+icon('check')+' Corregir</button><button class="btn ghost" onclick="loadExam()">'+icon('refresh')+' Otro examen</button></div>';
  document.getElementById('quizArea').innerHTML=html;
}
function renderQ(q,qi,tag){
  let h='<div class="quiz-q" id="q-'+qi+'" style="animation-delay:'+(qi*0.03)+'s"><div class="qhead">Pregunta '+(qi+1)+(tag?' · '+tag:'')+'</div><div class="qtext">'+q.q+'</div>';
  q.options.forEach((o,oi)=>{h+='<label class="opt" data-q="'+qi+'" data-o="'+oi+'" onclick="selectOpt('+qi+','+oi+')">'+o+
    '<div class="exp">'+(oi===q.correct?'✓ Correcta. ':'✗ ')+q.exp+'</div></label>';});
  return h+'</div>';
}
function loadQuiz(){
  quizMod=+document.getElementById('quizFilter').value;
  quizAnswers={};quizSubmitted=false;
  const qs=QUIZ[quizMod].questions;
  const best=store.best['m'+quizMod];
  let html='<div class="quiz-intro"><b>'+QUIZ[quizMod].title+'</b><br>'+
    '<span style="color:var(--ink2);font-size:13px">'+qs.length+' preguntas · elegí una opción por pregunta y luego corregí.</span>'+
    (best!=null?'<br><span class="quiz-best">'+icon('star')+' Tu mejor puntaje: '+best+'/'+qs.length+'</span>':'')+'</div>';
  qs.forEach((q,qi)=>html+=renderQ(q,qi,''));
  html+='<div class="quiz-actions"><button class="btn" onclick="submitQuiz()">'+icon('check')+' Corregir</button><button class="btn ghost" onclick="loadQuiz()">'+icon('refresh')+' Reiniciar</button></div>';
  document.getElementById('quizArea').innerHTML=html;
}
function selectOpt(qi,oi){
  if(quizSubmitted)return;
  quizAnswers[qi]=oi;
  document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(el=>el.classList.toggle('sel',+el.dataset.o===oi));
}
function grade(qs){
  let score=0;
  qs.forEach((q,qi)=>{
    const ans=quizAnswers[qi];
    document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(el=>{
      const oi=+el.dataset.o;el.classList.add('show-exp');
      if(oi===q.correct)el.classList.add('correct');
      if(ans===oi&&oi!==q.correct)el.classList.add('wrong');
    });
    if(ans===q.correct)score++;
  });
  quizSubmitted=true;
  const pct=Math.round(score/qs.length*100);
  const msg=pct===100?'Excelente: dominio completo.':pct>=70?'Buen resultado. Repasá las que fallaste.':pct>=50?'Aprobado. Conviene revisar el módulo.':'A reforzar: repasá el módulo y reintentá.';
  const res=document.createElement('div');res.className='quiz-result';
  res.innerHTML='<div class="score">'+score+'/'+qs.length+'</div><div class="msg">'+pct+'% · '+msg+'</div>';
  const area=document.getElementById('quizArea');area.insertBefore(res,area.firstChild);
  window.scrollTo({top:0,behavior:'smooth'});
  return score;
}
function submitQuiz(){
  if(quizSubmitted)return;
  const score=grade(QUIZ[quizMod].questions);
  const k='m'+quizMod;
  if(store.best[k]==null||score>store.best[k]){store.best[k]=score;save();}
}
function submitExam(){if(quizSubmitted)return;grade(examQs);}

/* ============ BÚSQUEDA ============ */
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}
function doSearch(term){
  term=term.trim().toLowerCase();
  if(term.length<3){if(current==='search')go('home');return;}
  current='search';setActiveNav('');
  const results=[];
  MODULES.forEach((m,i)=>{
    const txt=stripHtml(m.body);const low=txt.toLowerCase();
    let idx=low.indexOf(term);
    if(idx>=0||m.title.toLowerCase().includes(term)){
      let snippet='';
      if(idx>=0){const s=Math.max(0,idx-60);snippet=txt.substring(s,idx+term.length+90);
        snippet=(s>0?'…':'')+snippet+'…';
        snippet=snippet.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}
      results.push({i,title:m.title,snippet});
    }
  });
  let html='<div class="view active"><div class="mod-head"><span class="eyebrow">'+icon('search')+' Búsqueda</span>'+
    '<h2>Resultados para "'+term+'"</h2><div class="lead">'+results.length+' módulo(s) coinciden.</div></div><div class="searchresults">';
  if(!results.length)html+='<div class="empty">Sin coincidencias. Probá otro término.</div>';
  results.forEach(r=>{html+='<div class="sr-item" onclick="go(\'mod-'+r.i+'\')"><div class="sr-mod">Módulo '+(r.i+1)+'</div><h5>'+r.title+'</h5><p>'+(r.snippet||'')+'</p></div>';});
  html+='</div></div>';
  document.getElementById('content').innerHTML=html;
}
document.getElementById('globalSearch').addEventListener('input',e=>doSearch(e.target.value));

/* ============ ATAJOS / SCROLL ============ */
document.addEventListener('keydown',e=>{
  if(current!=='flashcards')return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();flipCard();}
  else if(e.code==='ArrowRight')nextCard();
  else if(e.code==='ArrowLeft')prevCard();
});
window.addEventListener('scroll',()=>{
  document.getElementById('totop').classList.toggle('show',window.scrollY>500);
});

/* ============ INIT ============ */
buildNav();updateProgress();renderHome();
</script>
